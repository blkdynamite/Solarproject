[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-rooftop"
version = "1.0.0"
description = "Commercial rooftop PV: energy yield, project financials and automated performance monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.11,<0.17",
    # pvlib's TMY3 reader fails on pandas 3 (read-only arrays under copy-on-write).
    "pandas>=2.1,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
solar-rooftop = "solar_rooftop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::FutureWarning:solar_rooftop",
    # numpy>=2.4 deprecation raised inside pandas/pvlib internals, not our code
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning:pandas|pvlib",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Every function is typed; pandas-stubs is deliberately not used (its strictness
# around label-based indexing adds noise without catching real bugs here).
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
